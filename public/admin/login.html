<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotDash · Painel dos Donos</title>
<meta name="robots" content="noindex,nofollow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #0a0a0a; color: #e8e8e8; font-family: 'Inter', sans-serif; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at top, rgba(139,111,255,0.06), transparent 60%), #0a0a0a;
    padding: 20px;
  }
  .card {
    background: #141414; border: 1px solid #1f1f1f;
    border-radius: 14px; padding: 32px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand .lg {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, #8b6fff, #5a4ad1);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 15px;
  }
  .brand .nm { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 30px;
    background: rgba(245,197,66,0.08); border: 1px solid rgba(245,197,66,0.25);
    color: #f5c542; font-size: 10px; font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px;
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
  .sub { color: #888; font-size: 12.5px; margin-bottom: 22px; }
  .alert { padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; display: none; }
  .alert.err { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
  .alert.ok  { background: rgba(34,197,94,0.08);  border: 1px solid rgba(34,197,94,0.3);  color: #7dd3a4; display: block; }
  label { display: block; font-size: 11.5px; color: #aaa; margin-bottom: 5px; font-weight: 600; }
  input {
    width: 100%; padding: 11px 13px;
    background: #0a0a0a; border: 1px solid #2a2a2a;
    border-radius: 8px; color: #e8e8e8; font: inherit; font-size: 13px;
    margin-bottom: 14px; transition: border-color .15s;
  }
  input:focus { outline: none; border-color: #8b6fff; }
  button.primary {
    width: 100%; padding: 12px 0; cursor: pointer; border: 0;
    background: linear-gradient(90deg, #8b6fff, #7758ff);
    color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 8px; transition: filter .15s;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: .55; cursor: wait; }
  .divider {
    text-align: center; color: #555; font-size: 11px;
    margin: 18px 0 14px; font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; gap: 10px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: #1f1f1f;
  }
  .btn-discord {
    width: 100%; display: flex; align-items: center; justify-content: center;
    gap: 10px; background: transparent; border: 1px solid #2a2a2a;
    color: #fff; padding: 11px; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: all .15s;
  }
  .btn-discord:hover { border-color: #5865f2; background: rgba(88,101,242,0.06); }
  .foot { text-align: center; margin-top: 18px; color: #555; font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .foot a { color: #888; text-decoration: none; }
  .foot a:hover { color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="lg">B</div>
      <div class="nm">BotDash</div>
    </div>

    <div class="pill">Acesso restrito</div>
    <h1>Painel dos Donos</h1>
    <div class="sub">Esse painel é exclusivo da equipe BotDash. Outros usuários, voltem ao <a href="/login.html" style="color:#8b6fff;">login normal</a>.</div>

    <div id="alert" class="alert"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <label for="email">email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="voce@botdash.app">

      <label for="password">senha</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">

      <button type="submit" class="primary" id="login-btn">entrar →</button>
    </form>

    <div class="divider">ou</div>

    <a id="discord-btn" href="/admin/auth/discord" class="btn-discord">
      <svg width="18" height="18" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.6L44 3.4a54 54 0 0 0-16.2 0L26.4.6A58.4 58.4 0 0 0 11.9 4.9C2.8 18.6.3 31.9 1.6 45a58.9 58.9 0 0 0 18 9c1.4-2 2.7-4.1 3.8-6.3-2.1-.8-4.1-1.8-6-3l1.4-1.1A41.9 41.9 0 0 0 36 47.4c12 0 18.2-3.4 19.2-3.8l1.4 1.1a37 37 0 0 1-6 3c1 2.2 2.3 4.3 3.7 6.3a58.8 58.8 0 0 0 18-9c1.6-15.1-2.4-28.3-12.2-39.1ZM23.7 36.4c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Zm24 0c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Z"/></svg>
      continuar com Discord
    </a>

    <div class="foot">
      <a href="/api/session/health" target="_blank">diagnóstico do sistema</a> · <a href="/login.html">login normal</a>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const a = document.getElementById('alert');
if (params.get('err')) {
  const errMap = {
    not_authorized: 'Sua conta não tem permissão pra esse painel. Fale com um super-admin.',
    not_allowlisted: 'Seu Discord não está na lista de donos autorizados.',
    no_discord: 'Discord OAuth não configurado nesse ambiente.',
    auth_failed: 'Falha na autenticação Discord. Confira o callback URL no Developer Portal: ' + location.origin + '/admin/auth/discord/callback',
    session_save: 'Login OK mas falhou ao salvar a sessão (volume persistente?).',
    inactive: 'Sua conta está desativada.'
  };
  a.className = 'alert err';
  a.textContent = errMap[params.get('err')] || 'Erro: ' + params.get('err');
}

// Auto-redirect se ja logado como super-admin
fetch('/admin/auth/me', { credentials: 'same-origin' })
  .then(r => r.json())
  .then(m => { if (m.super_admin) location.href = '/admin/'; })
  .catch(() => {});

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'entrando...';
  try {
    const r = await fetch('/admin/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const j = await r.json();
    if (!r.ok) {
      a.className = 'alert err';
      a.textContent = j.error || 'Falha no login';
      btn.disabled = false; btn.textContent = 'entrar →';
      return;
    }
    location.href = j.redirect || '/admin/';
  } catch (err) {
    a.className = 'alert err'; a.textContent = err.message;
    btn.disabled = false; btn.textContent = 'entrar →';
  }
}
</script>
</body>
</html>
