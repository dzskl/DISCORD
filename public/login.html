<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — BotDash</title>
<link rel="stylesheet" href="/_design-system.css">
<style>
  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(139,111,255,0.12), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(88,101,242,0.05), transparent 50%),
      #0a0a0a;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .card-login {
    width: 100%; max-width: 440px;
    background: #0e0e0e;
    border: 1px solid #1f1f1f;
    border-radius: 14px;
    padding: 38px 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 80px rgba(139,111,255,0.06);
    position: relative; z-index: 1;
  }
  .brand-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px;
  }
  .brand-logo {
    width: 44px; height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, #8b6fff, #5a4ad1);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 19px;
    box-shadow: 0 6px 20px rgba(139,111,255,0.35);
  }
  .brand-name { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  .brand-tag {
    margin-left: auto;
    font-size: 10px; padding: 4px 10px;
    border-radius: 999px;
    background: rgba(34,197,94,0.13);
    color: #7dd3a4;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .brand-tag .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.7); } }
  h1 {
    font-size: 24px; font-weight: 800;
    color: #fff; margin-bottom: 6px;
    letter-spacing: -.01em;
  }
  .sub {
    font-size: 13px;
    color: #888; margin-bottom: 24px;
    line-height: 1.5;
  }
  .field { margin-bottom: 14px; }
  .flabel {
    font-size: 11.5px;
    color: #aaa;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .inp {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 13px;
    color: #fff;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }
  .inp:focus {
    border-color: #8b6fff;
    box-shadow: 0 0 0 3px rgba(139,111,255,0.1);
  }
  .btn {
    width: 100%;
    background: linear-gradient(90deg, #8b6fff, #7758ff);
    color: #fff;
    border: 0;
    padding: 13px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: filter .15s, transform .05s;
    font-family: 'Inter', sans-serif;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(0.5px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-discord {
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #fff;
    padding: 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all .15s;
    font-family: 'Inter', sans-serif;
  }
  .btn-discord:hover {
    border-color: #5865f2;
    background: rgba(88,101,242,0.06);
  }
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0;
    color: #444;
    font-size: 10.5px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: #1a1a1a;
  }
  .alert {
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    margin-bottom: 16px;
    display: none;
    line-height: 1.5;
    border: 1px solid;
  }
  .alert.err {
    background: rgba(239,68,68,0.08);
    color: #fca5a5;
    border-color: rgba(239,68,68,0.3);
    display: block;
  }
  .alert.ok {
    background: rgba(34,197,94,0.08);
    color: #7dd3a4;
    border-color: rgba(34,197,94,0.3);
    display: block;
  }
  .foot-link {
    font-size: 13px;
    color: #888;
    text-align: center;
    margin-top: 18px;
  }
  .foot-link a {
    color: #b9a8ff;
    text-decoration: none;
    font-weight: 600;
  }
  .foot-link a:hover { color: #fff; }
</style>
</head>
<body>
  <div class="card-login">
    <div class="brand-row">
      <div class="brand-logo">B</div>
      <div class="brand-name">BotDash</div>
      <span class="brand-tag"><span class="pulse"></span>online</span>
    </div>

    <h1 id="title">Entrar na sua conta</h1>
    <div class="sub" id="subtitle">use seu email e senha pra acessar o painel.</div>

    <div id="alert" class="alert"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <div class="flabel">email</div>
        <input class="inp" id="email" type="email" required placeholder="voce@exemplo.com" autocomplete="email">
      </div>
      <div class="field">
        <div class="flabel">senha</div>
        <input class="inp" id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="login-btn">entrar →</button>
    </form>

    <div class="divider" id="divider">ou</div>

    <a id="discord-btn" href="/auth/discord" class="btn-discord">
      <svg width="18" height="18" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.6L44 3.4a54 54 0 0 0-16.2 0L26.4.6A58.4 58.4 0 0 0 11.9 4.9C2.8 18.6.3 31.9 1.6 45a58.9 58.9 0 0 0 18 9c1.4-2 2.7-4.1 3.8-6.3-2.1-.8-4.1-1.8-6-3l1.4-1.1A41.9 41.9 0 0 0 36 47.4c12 0 18.2-3.4 19.2-3.8l1.4 1.1a37 37 0 0 1-6 3c1 2.2 2.3 4.3 3.7 6.3a58.8 58.8 0 0 0 18-9c1.6-15.1-2.4-28.3-12.2-39.1ZM23.7 36.4c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Zm24 0c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Z"/></svg>
      continuar com Discord
    </a>

    <div class="foot-link" style="margin-bottom:8px;">
      <a href="/forgot.html" style="color:#666;">esqueci minha senha</a>
    </div>
    <div class="foot-link">
      <span id="bottom-text">não tem conta? <a href="/register.html">crie uma →</a></span>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const a = document.getElementById('alert');
if (params.get('login') === 'denied') { a.className = 'alert err'; a.textContent = 'sua conta nao tem permissao.'; }
if (params.get('login') === 'fail') {
  a.className = 'alert err';
  const reason = params.get('reason');
  const msgs = {
    no_credentials: 'Discord OAuth não configurado. Configure DISCORD_CLIENT_ID/SECRET em Credenciais.',
    auth_failed: 'Discord rejeitou o login. Verifique o callback URL em Developer Portal: deve ser exatamente ' + location.origin + '/auth/discord/callback',
    session_save: 'Login OK mas falhou ao salvar a sessão (DB sem volume persistente?).',
    access_denied: 'Você cancelou a autorização no Discord.',
    denied: 'Sua conta está desativada.'
  };
  a.textContent = msgs[reason] || ('Falha no login' + (reason ? ': ' + reason : '.') + ' Veja /diagnostico.html');
}
if (params.get('login') === 'denied') { a.className = 'alert err'; a.textContent = 'Sua conta está desativada.'; }
if (params.get('registered')) { a.className = 'alert ok'; a.textContent = '✓ conta criada — faça login agora.'; }

fetch('/auth/me', { credentials: 'include' }).then(r => r.json()).then(m => {
  if (m.authenticated && m.admin) { location.href = '/app.html'; return; }
  if (m.has_users === false) {
    document.getElementById('title').textContent = 'Crie a conta de owner';
    document.getElementById('subtitle').textContent = 'nenhum usuário cadastrado ainda — o primeiro vira owner do painel.';
    document.getElementById('login-btn').textContent = 'criar conta →';
    document.getElementById('login-form').setAttribute('data-mode', 'register');
    document.getElementById('bottom-text').innerHTML = 'já tem conta? <a href="/login.html?force=1">entrar →</a>';
  }
}).catch(() => {});

async function doLogin(e) {
  e.preventDefault();
  const mode = document.getElementById('login-form').getAttribute('data-mode') === 'register' ? 'register' : 'login';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = mode === 'register' ? 'criando...' : 'entrando...';
  try {
    const r = await fetch('/auth/' + mode, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (!r.ok) {
      a.className = 'alert err'; a.textContent = '✗ ' + (d.error || 'erro');
      btn.disabled = false; btn.textContent = mode === 'register' ? 'criar conta →' : 'entrar →';
      return;
    }
    location.href = '/app.html';
  } catch {
    a.className = 'alert err'; a.textContent = 'erro de conexão';
    btn.disabled = false; btn.textContent = 'entrar →';
  }
}
</script>
</body>
</html>
