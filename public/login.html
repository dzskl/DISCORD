<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — BotDash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Syne',sans-serif;background:#0a0a0a;color:#e8e8e8;overflow-x:hidden;}
.bg{position:fixed;inset:0;background:
  radial-gradient(circle at 20% 20%, rgba(88,101,242,0.12), transparent 50%),
  radial-gradient(circle at 80% 80%, rgba(95,255,95,0.05), transparent 50%),
  #0a0a0a;}
.grid-bg{position:fixed;inset:0;background-image:
  linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
background-size:40px 40px;}
.wrap{position:relative;z-index:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:30px 20px;}
.card{width:100%;max-width:440px;background:#0e0e0e;border:1px solid #1f1f1f;border-radius:14px;padding:38px 36px;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 60px rgba(88,101,242,0.05);}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#5865f2,#404eed);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:19px;letter-spacing:.04em;}
.brand-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:.04em;}
.brand-tag{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#5fff5f;background:#0a1f0a;border:1px solid #1a4a1a;padding:2px 7px;border-radius:20px;margin-left:auto;}
h1{font-size:22px;font-weight:700;color:#fff;letter-spacing:.02em;margin-bottom:6px;line-height:1.3;}
.sub{font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:#666;margin-bottom:24px;line-height:1.5;}
.field{margin-bottom:14px;}
.flabel{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:600;}
.inp{width:100%;background:#0a0a0a;border:1px solid #222;border-radius:7px;padding:11px 14px;font-size:13px;font-family:'IBM Plex Mono',monospace;color:#fff;outline:none;transition:border-color .12s;}
.inp:focus{border-color:#5865f2;}
.btn{width:100%;background:#5865f2;color:#fff;border:none;padding:13px;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:background .15s;}
.btn:hover{background:#4752c4;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-discord{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:1px solid #2a2a2a;color:#fff;padding:11px;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s;margin-top:10px;}
.btn-discord:hover{border-color:#5865f2;background:rgba(88,101,242,0.06);}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#444;font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1a1a1a;}
.alert{padding:10px 12px;border-radius:6px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:16px;display:none;line-height:1.5;}
.alert.err{background:#1f0a0a;color:#ff5f5f;border:1px solid #3a1010;display:block;}
.alert.ok{background:#0a1f0a;color:#5fff5f;border:1px solid #1a4a1a;display:block;}
.foot-link{font-size:12.5px;color:#666;text-align:center;margin-top:18px;font-family:'IBM Plex Mono',monospace;}
.foot-link a{color:#5865f2;text-decoration:none;}
.foot-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-bg"></div>
<div class="wrap">
  <div class="card">
    <div class="brand">
      <div class="logo">B</div>
      <div class="brand-name">BotDash</div>
      <div class="brand-tag">● online</div>
    </div>

    <h1 id="title">Entrar na sua conta</h1>
    <div class="sub" id="subtitle">use seu email e senha pra acessar o painel.</div>

    <div id="alert" class="alert"></div>

    <form id="login-form" onsubmit="doLogin(event)">
      <div class="field">
        <div class="flabel">email</div>
        <input class="inp" id="email" type="email" required placeholder="voce@exemplo.com" autocomplete="email">
      </div>
      <div class="field">
        <div class="flabel">senha</div>
        <input class="inp" id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" type="submit" id="login-btn">entrar →</button>
    </form>

    <div class="divider" id="divider">ou</div>

    <a id="discord-btn" href="/auth/discord" class="btn-discord">
      <svg width="18" height="18" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.6.6L44 3.4a54 54 0 0 0-16.2 0L26.4.6A58.4 58.4 0 0 0 11.9 4.9C2.8 18.6.3 31.9 1.6 45a58.9 58.9 0 0 0 18 9c1.4-2 2.7-4.1 3.8-6.3-2.1-.8-4.1-1.8-6-3l1.4-1.1A41.9 41.9 0 0 0 36 47.4c12 0 18.2-3.4 19.2-3.8l1.4 1.1a37 37 0 0 1-6 3c1 2.2 2.3 4.3 3.7 6.3a58.8 58.8 0 0 0 18-9c1.6-15.1-2.4-28.3-12.2-39.1ZM23.7 36.4c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Zm24 0c-3.6 0-6.5-3.3-6.5-7.4s2.9-7.4 6.5-7.4c3.6 0 6.5 3.3 6.5 7.4s-2.9 7.4-6.5 7.4Z"/></svg>
      continuar com Discord
    </a>

    <div class="foot-link">
      <span id="bottom-text">não tem conta? <a href="/register.html">crie uma →</a></span>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const a = document.getElementById('alert');
if (params.get('login') === 'denied') { a.className = 'alert err'; a.textContent = 'sua conta nao tem permissao.'; }
if (params.get('login') === 'fail') { a.className = 'alert err'; a.textContent = 'falha no login.'; }
if (params.get('registered')) { a.className = 'alert ok'; a.textContent = '✓ conta criada — faça login agora.'; }

// Setup check + auto-redirect se ja logado
fetch('/api/setup/status').then(r => r.json()).then(d => {
  if (!d.complete) { location.href = '/setup.html'; return; }
  return fetch('/auth/me', { credentials: 'include' }).then(r => r.json()).then(m => {
    if (m.authenticated && m.admin) location.href = '/app.html';
    if (m.has_users === false) {
      document.getElementById('title').textContent = 'Crie a conta de owner';
      document.getElementById('subtitle').textContent = 'nenhum usuário cadastrado ainda — o primeiro vira owner do painel.';
      document.getElementById('login-btn').textContent = 'criar conta →';
      document.getElementById('login-form').setAttribute('data-mode', 'register');
      document.getElementById('bottom-text').innerHTML = 'já tem conta? <a href="/login.html?force=1">entrar →</a>';
    }
  });
}).catch(() => {});

async function doLogin(e) {
  e.preventDefault();
  const mode = document.getElementById('login-form').getAttribute('data-mode') === 'register' ? 'register' : 'login';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = mode === 'register' ? 'criando...' : 'entrando...';
  try {
    const r = await fetch('/auth/' + mode, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const d = await r.json();
    if (!r.ok) {
      a.className = 'alert err'; a.textContent = '✗ ' + (d.error || 'erro');
      btn.disabled = false; btn.textContent = mode === 'register' ? 'criar conta →' : 'entrar →';
      return;
    }
    location.href = '/app.html';
  } catch {
    a.className = 'alert err'; a.textContent = 'erro de conexão';
    btn.disabled = false; btn.textContent = 'entrar →';
  }
}
</script>
</body>
</html>
