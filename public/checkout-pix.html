<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento PIX — BotDash</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:#0a0a0a;color:#e8e8e8;min-height:100vh;padding:40px 20px;}
.wrap{max-width:520px;margin:0 auto;}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:32px;text-align:center;}
.head{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px;}
.brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#5865f2,#4752c4);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;}
.brand{font-size:14px;font-weight:700;color:#fff;letter-spacing:.04em;}
h1{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;}
.sub{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#666;margin-bottom:24px;}
.amount{font-size:36px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:24px;}
.qr{background:#fff;padding:18px;border-radius:12px;display:inline-block;margin-bottom:20px;}
.qr img{display:block;max-width:240px;height:auto;}
.copy-label{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.copy-row{display:flex;gap:8px;margin-bottom:20px;}
.copy-row input{flex:1;background:#0a0a0a;border:1px solid #222;border-radius:7px;padding:11px 13px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#fff;outline:none;text-overflow:ellipsis;}
.copy-btn{background:#5865f2;color:#fff;border:none;padding:0 18px;border-radius:7px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;}
.copy-btn:hover{background:#4752c4;}
.copy-btn.copied{background:#5fff5f;color:#000;}
.status{padding:14px;border-radius:8px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;display:flex;align-items:center;gap:10px;justify-content:center;}
.status.pending{background:#1a1900;color:#ffdf5f;border:1px solid #3a3000;}
.status.paid{background:#0a1f0a;color:#5fff5f;border:1px solid #1a4a1a;}
.status.err{background:#1f0a0a;color:#ff5f5f;border:1px solid #3a1010;}
.spinner{width:14px;height:14px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.steps{text-align:left;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;padding:14px 16px;margin-bottom:18px;}
.steps-title{font-size:10px;font-family:'IBM Plex Mono',monospace;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.steps ol{padding-left:18px;}
.steps li{font-size:12px;color:#888;line-height:1.7;font-family:'IBM Plex Mono',monospace;}
.back{display:inline-block;margin-top:12px;font-size:12px;color:#555;text-decoration:none;font-family:'IBM Plex Mono',monospace;}
.back:hover{color:#888;}
footer{text-align:center;margin-top:24px;font-size:10px;font-family:'IBM Plex Mono',monospace;color:#333;}
.checkmark{font-size:48px;color:#5fff5f;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="head">
      <div class="brand-logo">B</div>
      <div class="brand">BotDash</div>
    </div>
    <h1 id="title">Pague com PIX</h1>
    <div class="sub">aprovação em até 60 segundos</div>
    <div class="amount" id="amount">R$ 0,00</div>

    <div id="qr-area">
      <div class="qr"><img id="qr-img" alt="QR Code PIX"></div>
      <div class="copy-label">copia e cola</div>
      <div class="copy-row">
        <input id="copy-input" readonly>
        <button class="copy-btn" id="copy-btn" onclick="copyCode()">copiar</button>
      </div>
      <div class="steps">
        <div class="steps-title">como pagar</div>
        <ol>
          <li>Abra seu app do banco</li>
          <li>Escolha PIX → Pix Copia e Cola</li>
          <li>Cole o código acima ou escaneie o QR</li>
          <li>Confirme o pagamento</li>
        </ol>
      </div>
    </div>

    <div class="status pending" id="status">
      <div class="spinner"></div>
      <span>aguardando pagamento...</span>
    </div>

    <a href="/loja.html" class="back">← voltar pra loja</a>
  </div>
  <footer>BotDash · processado por MisticPay</footer>
</div>

<script>
const params = new URLSearchParams(location.search);
const txId = params.get('tx');
const amount = parseInt(params.get('amount') || '0');
const qrBase64 = sessionStorage.getItem('pix_qr_' + txId);
const copyCode = sessionStorage.getItem('pix_code_' + txId);

if (!txId) {
  document.body.innerHTML = '<div class="wrap"><div class="card"><h1>Transação inválida</h1><a href="/loja.html" class="back">← voltar pra loja</a></div></div>';
} else {
  document.getElementById('amount').textContent = 'R$ ' + (amount / 100).toFixed(2).replace('.', ',');
  if (qrBase64) {
    document.getElementById('qr-img').src = qrBase64.startsWith('data:') ? qrBase64 : 'data:image/png;base64,' + qrBase64;
  }
  if (copyCode) {
    document.getElementById('copy-input').value = copyCode;
  }
  pollStatus();
}

let pollCount = 0;
async function pollStatus() {
  pollCount++;
  if (pollCount > 200) return; // ~10 min
  try {
    const r = await fetch('/api/checkout/pix/status/' + encodeURIComponent(txId)).then(r => r.json());
    if (r.status === 'paid') {
      showSuccess();
      return;
    }
  } catch {}
  setTimeout(pollStatus, 3000);
}

function showSuccess() {
  document.getElementById('qr-area').style.display = 'none';
  document.getElementById('title').textContent = 'Pagamento confirmado!';
  document.getElementById('status').className = 'status paid';
  document.getElementById('status').innerHTML = '<span style="font-size:18px;">✓</span><span>seu cargo será liberado em segundos</span>';
  sessionStorage.removeItem('pix_qr_' + txId);
  sessionStorage.removeItem('pix_code_' + txId);
  setTimeout(() => location.href = '/loja.html?status=ok', 4000);
}

function copyCode() {
  const inp = document.getElementById('copy-input');
  inp.select();
  navigator.clipboard.writeText(inp.value).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.textContent = '✓ copiado';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'copiar'; }, 2000);
  });
}
</script>
</body>
</html>
